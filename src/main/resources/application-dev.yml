spring:
  # 开发环境数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/apartment_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  # 开发环境Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
  
  # 开发环境Elasticsearch配置
  elasticsearch:
    uris: http://localhost:9200
  
  # 开发环境RabbitMQ配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  # 开发环境热部署
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

# 开发环境日志配置
logging:
  level:
    root: INFO
    com.apartment: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: DEBUG

# 开发环境服务器配置
server:
  port: 8080

# 开发环境JWT配置（使用较短的过期时间便于测试）
jwt:
  secret: dev-secret-key-for-testing-only-change-in-production-min-256-bits
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# 开发环境跨域配置
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: '*'
    allow-credentials: true
    max-age: 3600

